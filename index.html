<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

header {
    background: #1f2937;
    padding: 18px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #1f2937;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

h2 {
    margin-top: 0;
}

button,
select {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
    touch-action: manipulation;
}

#resetGpsButton {
    background: #dc2626;
}

#mapContainer {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 12px;
    background: #000;
}

#mapImage {
    width: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
}

#canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#mapMessage {
    text-align: center;
    padding: 10px;
    color: #cbd5e1;
}

.info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
}

.infoBox {
    background: #111827;
    padding: 12px;
    border-radius: 10px;
}

.label {
    color: #9ca3af;
    font-size: 13px;
}

.value {
    margin-top: 4px;
    font-size: 16px;
    font-weight: bold;
    word-break: break-word;
}

.legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.legendItem {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legendColor {
    width: 14px;
    height: 14px;
    border-radius: 50%;
}

#status {
    padding: 12px;
    border-radius: 10px;
    background: #111827;
    line-height: 1.5;
}

.small {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.5;
}

.good {
    color: #4ade80;
}

.warning {
    color: #fbbf24;
}

.bad {
    color: #f87171;
}

@media (max-width: 600px) {
    header {
        font-size: 20px;
    }

    .container {
        padding: 12px;
    }

    .card {
        padding: 14px;
    }

    button,
    select {
        min-height: 50px;
        font-size: 16px;
    }
}
</style>
</head>

<script>

/* =====================================================
   KAART
===================================================== */

const MAP_WIDTH = 755;
const MAP_HEIGHT = 553;

const AUTO_MAP_START = {
    x: 400,
    y: 272
};


/*
   Geschatte schaal.
*/
const PIXELS_PER_METER = 12;


/*
   Eventuele draaiing van de kaart.
*/
const MAP_ROTATION_DEG = 0;


/* =====================================================
   GPS FILTER INSTELLINGEN
===================================================== */

/*
   Beweging kleiner dan ongeveer 1,5 meter
   wordt als GPS-ruis gezien.
*/
const MIN_MOVEMENT_METERS = 1.5;


/*
   Extreem slechte GPS-metingen worden
   niet gebruikt voor beweging op de kaart.
*/
const MAX_USABLE_ACCURACY = 40;


/*
   Hoe vloeiend de GPS beweegt.

   Lager = stabieler
   Hoger = sneller reageren
*/
const GPS_SMOOTHING = 0.22;


/* =====================================================
   GPS
===================================================== */

let watchId = null;

let gpsRunning = false;
let gpsStarting = false;

let rawGPSPosition = null;
let gpsPosition = null;
let previousAcceptedGPS = null;

let gpsReference = null;

let targetGPSMapPoint = null;
let displayedGPSMapPoint = null;

let routeActive = false;

let gpsUpdateCount = 0;


/* =====================================================
   ELEMENTEN
===================================================== */

const gpsButton =

const resetGpsButton =

const gpsStatus =

const latitude =

const longitude =

const accuracy =

const liveStatus =

const canvas =

const ctx =

const mapMessage =
    document.getElementById("mapMessage");

const rooms = {

/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas() {

    const rect =
        mapContainer.getBoundingClientRect();

    canvas.width =
        rect.width;

        rect.height;

    draw();

window.addEventListener(

);


/* =====================================================
   GPS KNOP
===================================================== */

gpsButton.addEventListener(
    "click",
    function() {

        if (gpsRunning || gpsStarting) {

            stopGPS();

        } else {

            startGPS();

        }

    }
);


/* =====================================================
   GPS STARTEN
===================================================== */

function startGPS() {

    if (!navigator.geolocation) {

        gpsStatus.textContent =
            "Deze browser ondersteunt geen GPS.";

        liveStatus.textContent =
            "Niet beschikbaar";

        return;

    }


    if (!window.isSecureContext) {

        gpsStatus.textContent =
            "Gebruik HTTPS op je telefoon.";

        liveStatus.textContent =
            "HTTPS nodig";

        status.textContent =
            "Locatie werkt op telefoon alleen in een veilige HTTPS-pagina.";

        return;

    }


    gpsStarting = true;


    gpsButton.textContent =
        "📡 Locatie aanvragen...";


    gpsStatus.textContent =
        "Geef toestemming voor je locatie.";


    liveStatus.textContent =
        "Starten...";


    /*
       Eerst expliciet een positie aanvragen.
       Hierdoor verschijnt op de telefoon
       de locatie-permissie.
    */

    navigator.geolocation.getCurrentPosition(

        function(position) {

            gpsStarting = false;

            gpsRunning = true;


            handleGPSPosition(
                position
            );


            startLiveWatch();


            gpsButton.textContent =
                "⛔ Live locatie stoppen";


            gpsStatus.textContent =
                "Live GPS actief.";


            gpsStatus.className =
                "small good";


            liveStatus.textContent =
                "LIVE";

        },

        handleGPSError,

        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:20000
        }

    );

}


/* =====================================================
   ECHTE LIVE GPS
===================================================== */

function startLiveWatch() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    watchId =
        navigator.geolocation.watchPosition(

            handleGPSPosition,

            handleGPSError,

            {
                enableHighAccuracy:true,
                maximumAge:0,
                timeout:30000
            }

        );

}


/* =====================================================
   GPS STOPPEN
===================================================== */

function stopGPS() {

    gpsRunning = false;

    gpsStarting = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }


    gpsButton.textContent =
        "📍 Live locatie starten";


    gpsStatus.textContent =
        "Live GPS staat uit.";


    gpsStatus.className =
        "small";


    liveStatus.textContent =
        "Uit";


    status.textContent =
        "Live locatie gestopt.";

}


/* =====================================================
   GPS POSITIE
===================================================== */

function handleGPSPosition(position) {

    if (
        !position ||
        !position.coords
    ) {
        return;
    }


    const newGPS = {

        latitude:
            position.coords.latitude,

        longitude:
            position.coords.longitude,

        accuracy:
            position.coords.accuracy,

        timestamp:
            position.timestamp ||
            Date.now()

    };


    rawGPSPosition =
        newGPS;


    gpsUpdateCount++;


    /*
       Altijd de echte waarden laten zien.
    */

    latitude.textContent =
        newGPS.latitude.toFixed(7);


    longitude.textContent =
        newGPS.longitude.toFixed(7);


    accuracy.textContent =
        Math.round(
            newGPS.accuracy
        ) +
        " meter";


    const updateTime =
        new Date(
            newGPS.timestamp
        );


    lastUpdate.textContent =
        updateTime.toLocaleTimeString(
            "nl-NL"
        );


    liveStatus.textContent =
        "LIVE";


    /*
       Eerste locatie.
    */

    if (!gpsReference) {

        gpsReference = {

            latitude:
                newGPS.latitude,

            longitude:
                newGPS.longitude,

            mapX:
                AUTO_MAP_START.x,

            mapY:
                AUTO_MAP_START.y

        };


        gpsPosition = {

            ...newGPS

        };


        previousAcceptedGPS = {

            ...newGPS

        };


        targetGPSMapPoint = {

            x:
                AUTO_MAP_START.x,

            y:
                AUTO_MAP_START.y

        };


        displayedGPSMapPoint = {

            x:
                AUTO_MAP_START.x,

            y:
                AUTO_MAP_START.y

        };


        movement.textContent =
            "Start";


        mapMessage.textContent =
            "Live GPS actief.";


        status.textContent =
            "GPS startpositie ontvangen.";


        return;

    }


    /*
       Als de nauwkeurigheid extreem slecht is,
       laten we de stip niet verspringen.
    */

    if (
        newGPS.accuracy >
        MAX_USABLE_ACCURACY
    ) {

        movement.textContent =
            "GPS onnauwkeurig";


        gpsStatus.textContent =
            "Live GPS actief — signaal is tijdelijk onnauwkeurig.";


        gpsStatus.className =
            "small warning";


        status.textContent =
            "Meting niet gebruikt vanwege lage nauwkeurigheid: " +
            Math.round(
                newGPS.accuracy
            ) +
            " meter.";


        return;

    }


    /*
       Afstand vanaf laatste geaccepteerde locatie.
    */

    const moved =
        gpsDistanceMeters(
            previousAcceptedGPS,
            newGPS
        );


    movement.textContent =
        moved.toFixed(2) +
        " meter";


    /*
       Kleine bewegingen zijn meestal GPS-ruis.

       Als je telefoon bijvoorbeeld 0,4 meter
       of 0,8 meter heen en weer springt,
       blijft de stip gewoon staan.
    */

    const accuracyDeadZone =
        Math.min(
            3,
            Math.max(
                MIN_MOVEMENT_METERS,
                newGPS.accuracy * 0.12
            )
        );


    if (
        moved <
        accuracyDeadZone
    ) {

        gpsStatus.textContent =
            "Live GPS actief — positie stabiel.";


        gpsStatus.className =
            "small good";


        status.textContent =
            "Kleine GPS-afwijking weggefilterd.";


        return;

    }


    /*
       Onrealistische plotselinge sprongen
       niet meteen gebruiken.

       De maximale toegestane sprong wordt
       groter als GPS zelf aangeeft dat de
       nauwkeurigheid slechter is.
    */

    const maxJump =
        Math.max(
            12,
            newGPS.accuracy * 1.5
        );


    if (
        moved >
        maxJump
    ) {

        gpsStatus.textContent =
            "Live GPS actief — GPS-sprong weggefilterd.";


        gpsStatus.className =
            "small warning";


        status.textContent =
            "Onverwachte GPS-sprong van " +
            Math.round(moved) +
            " meter niet gebruikt.";


        return;

    }


    /*
       POSITIE SMOOTHEN

       In plaats van meteen naar de nieuwe
       latitude/longitude te springen,
       bewegen we geleidelijk richting
       de nieuwe positie.
    */

    let alpha =
        GPS_SMOOTHING;


    /*
       Betere nauwkeurigheid =
       iets sneller reageren.
    */

    if (
        newGPS.accuracy <= 8
    ) {

        alpha =
            0.42;

    }

    else if (
        newGPS.accuracy <= 15
    ) {

        alpha =
            0.30;

    }

    else {

        alpha =
            0.18;

    }


    gpsPosition = {

        latitude:
            gpsPosition.latitude +
            (
                newGPS.latitude -
                gpsPosition.latitude
            ) *
            alpha,

        longitude:
            gpsPosition.longitude +
            (
                newGPS.longitude -
                gpsPosition.longitude
            ) *
            alpha,

        accuracy:
            newGPS.accuracy,

        timestamp:
            newGPS.timestamp

    };


    previousAcceptedGPS = {

        ...newGPS

    };


    /*
       Gesmoothde positie naar kaart.
    */

    const mapPoint =
        gpsToMap(
            gpsPosition
        );


    if (
        mapPoint &&
        Number.isFinite(mapPoint.x) &&
        Number.isFinite(mapPoint.y)
    ) {

        targetGPSMapPoint = {

            x:
                mapPoint.x,

            y:
                mapPoint.y

        };

    }


    gpsStatus.textContent =
        "Live GPS actief — positie wordt gestabiliseerd.";


    gpsStatus.className =
        "small good";


    status.textContent =
        "GPS update #" +
        gpsUpdateCount +
        " verwerkt.";


    draw();

}


/* =====================================================
   GPS FOUT
===================================================== */

function handleGPSError(error) {

    console.log(
        "GPS fout:",
        error
    );


    if (
        error.code === 1
    ) {

        stopGPS();


        gpsStatus.textContent =
            "Locatietoegang geweigerd.";


        gpsStatus.className =
            "small bad";


        liveStatus.textContent =
            "Geblokkeerd";


        status.textContent =
            "Sta locatie en precieze locatie toe voor deze website.";


        return;

    }


    if (
        error.code === 2
    ) {

        gpsStatus.textContent =
            "GPS zoekt naar een beter signaal.";


        gpsStatus.className =
            "small warning";


        liveStatus.textContent =
            "LIVE / zoeken";


        return;

    }


    if (
        error.code === 3
    ) {

        /*
           Timeout stopt watchPosition niet.
        */

        gpsStatus.textContent =
            "Live GPS actief — wachten op nieuwe positie.";


        gpsStatus.className =
            "small warning";


        liveStatus.textContent =
            "LIVE";

    }

}


/* =====================================================
   GPS -> KAART
===================================================== */

function gpsToMap(position) {

    if (!gpsReference) {
        return null;
    }


    const northMeters =
        (
            position.latitude -
            gpsReference.latitude
        ) *
        111320;


    const eastMeters =
        (
            position.longitude -
            gpsReference.longitude
        ) *
        111320 *
        Math.cos(
            gpsReference.latitude *
            Math.PI /
            180
        );


    const angle =
        MAP_ROTATION_DEG *
        Math.PI /
        180;


    const rotatedX =
        eastMeters *
        Math.cos(angle) -
        northMeters *
        Math.sin(angle);


    const rotatedY =
        eastMeters *
        Math.sin(angle) +
        northMeters *
        Math.cos(angle);


    return {

        x:
            gpsReference.mapX +
            rotatedX *
            PIXELS_PER_METER,

        y:
            gpsReference.mapY -
            rotatedY *
            PIXELS_PER_METER

    };

}


/* =====================================================
   GPS AFSTAND
===================================================== */

function gpsDistanceMeters(a,b) {

    if (!a || !b) {
        return 0;
    }


    const R =
        6371000;


    const lat1 =
        a.latitude *
        Math.PI /
        180;


    const lat2 =
        b.latitude *
        Math.PI /
        180;


    const dLat =
        (
            b.latitude -
            a.latitude
        ) *
        Math.PI /
        180;


    const dLon =
        (
            b.longitude -
            a.longitude
        ) *
        Math.PI /
        180;


    const h =
        Math.sin(
            dLat / 2
        ) ** 2 +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(
            dLon / 2
        ) ** 2;


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(h),
            Math.sqrt(1-h)
        )
    );

}


/* =====================================================
   GPS RESET
===================================================== */

resetGpsButton.addEventListener(
    "click",
    function() {

        gpsReference =
            null;

        gpsPosition =
            null;

        rawGPSPosition =
            null;

        previousAcceptedGPS =
            null;

        targetGPSMapPoint =
            null;

        displayedGPSMapPoint =
            null;

        routeActive =
            false;

        gpsUpdateCount =
            0;


        movement.textContent =
            "-";


        mapMessage.textContent =
            "GPS startpositie opnieuw ingesteld.";


        status.textContent =
            "De volgende GPS-update wordt het nieuwe startpunt.";


        draw();

    }
);


/* =====================================================
   ROUTE
===================================================== */

routeButton.addEventListener(
    "click",
    function() {

        const room =
            roomSelect.value;


        if (!room) {

            destination.textContent =
                "Kies eerst een lokaal.";

            return;

        routeActive =
            true;


        destination.textContent =

        status.textContent =

            room +
            " actief.";

);


/* =====================================================
   AFSTAND
===================================================== */

function distance(a,b) {

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   DICHTSTBIJZIJNDE NODE
===================================================== */

function nearestNode(point) {

    let best =
        null;

    let bestDistance =
        Infinity;


    for (
        const key in nodes
    ) {

        const d =
            distance(
                point,
                nodes[key]
            );


        if (
            d <
            bestDistance
        ) {

            bestDistance =
                d;

            best =
                key;

        }

    }


    return best;

}


/* =====================================================
   PUNT OP LIJN
===================================================== */

function projectPointToSegment(
    point,
    a,
    b
) {

    const abX =
        b.x-a.x;

    const abY =
        b.y-a.y;

    const apX =
        point.x-a.x;

    const apY =
        point.y-a.y;


    const lengthSquared =
        abX*abX +
        abY*abY;


    if (
        lengthSquared === 0
    ) {

        return {
            x:a.x,
            y:a.y
        };

    }


    let t =
        (
            apX*abX +
            apY*abY
        ) /
        lengthSquared;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    return {

        x:
            a.x +
            abX*t,

        y:
            a.y +
            abY*t

    };

}


/* =====================================================
   DICHTSTBIJZIJNDE GANG
===================================================== */

function projectToNearestHallway(point) {

    let bestPoint =
        point;

    let bestDistance =
        Infinity;


    for (
        const connection
        of connections
    ) {

        const a =
            nodes[
                connection[0]
            ];

        const b =
            nodes[
                connection[1]
            ];


        const projected =
            projectPointToSegment(
                point,
                a,
                b
            );


        const d =
            distance(
                point,
                projected
            );


        if (
            d <
            bestDistance
        ) {

            bestDistance =
                d;

            bestPoint =
                projected;

        }

    }


    return bestPoint;

}


/* =====================================================
   DIJKSTRA
===================================================== */

function dijkstra(
    start,
    end
) {

    const dist = {};
    const previous = {};
    const visited = {};


    for (
        const key in nodes
    ) {

        dist[key] =
            Infinity;

        previous[key] =
            null;

        visited[key] =
            false;

    }


    dist[start] =
        0;


    while (true) {

        let current =
            null;

        let best =
            Infinity;


        for (
            const key in nodes
        ) {

            if (
                !visited[key] &&
                dist[key] < best
            ) {

                best =
                    dist[key];

                current =
                    key;

            }

        }


        if (
            current === null ||
            current === end
        ) {
            break;
        }


        visited[current] =
            true;


        for (
            const connection
            of connections
        ) {

            let neighbour =
                null;


            if (
                connection[0] === current
            ) {

                neighbour =
                    connection[1];

            }

            else if (
                connection[1] === current
            ) {

                neighbour =
                    connection[0];

            }


            if (!neighbour) {
                continue;
            }


            const weight =
                distance(
                    nodes[current],
                    nodes[neighbour]
                );


            const newDistance =
                dist[current] +
                weight;


            if (
                newDistance <
                dist[neighbour]
            ) {

                dist[neighbour] =
                    newDistance;

                previous[neighbour] =
                    current;

            }

        }

    }


    const path = [];

    let current =
        end;


    while (current) {

        path.unshift(
            current
        );

        current =
            previous[current];

    }


    return path;

}


/* =====================================================
   ROUTE TEKENEN
===================================================== */

function drawRoute() {

    if (
        !routeActive ||
        !displayedGPSMapPoint
    ) {
        return;
    }


    const room =
        roomSelect.value;


    if (!room) {
        return;
    }


    const access =
        roomAccess[room];


    if (!access) {
        return;
    }


    const hallwayStart =
        projectToNearestHallway(
            displayedGPSMapPoint
        );


    const startNode =
        nearestNode(
            hallwayStart
        );


    const path =
        dijkstra(
            startNode,
            access.node
        );


    if (!path.length) {
        return;
    }


    ctx.beginPath();


    ctx.moveTo(
        displayedGPSMapPoint.x,
        displayedGPSMapPoint.y
    );


    ctx.lineTo(
        hallwayStart.x,
        hallwayStart.y
    );


    ctx.lineTo(
        nodes[startNode].x,
        nodes[startNode].y
    );


    for (
        const node
        of path
    ) {

        ctx.lineTo(
            nodes[node].x,
            nodes[node].y
        );

    }


    ctx.lineTo(
        access.door.x,
        access.door.y
    );


    ctx.lineWidth =
        6;

    ctx.strokeStyle =
        "#22c55e";

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        access.door.x,
        access.door.y,
        9,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        "#3b82f6";


    ctx.fill();

}


/* =====================================================
   GPS STIP
===================================================== */

function drawGPSMarker() {

    if (
        !displayedGPSMapPoint
    ) {
        return;
    }


    const x =
        Math.max(
            0,
            Math.min(
                MAP_WIDTH,
                displayedGPSMapPoint.x
            )
        );


    const y =
        Math.max(
            0,
            Math.min(
                MAP_HEIGHT,
                displayedGPSMapPoint.y
            )
        );


    const pulse =
        19 +
        Math.sin(
            Date.now()/300
        ) *
        2;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        pulse,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(239,68,68,0.16)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        12,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#ef4444";

    ctx.fill();

}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    if (
        !canvas.width ||
        !canvas.height
    ) {
        return;
    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const scaleX =
        canvas.width /
        MAP_WIDTH;


    const scaleY =
        canvas.height /
        MAP_HEIGHT;


    ctx.save();


    ctx.scale(
        scaleX,
        scaleY
    );


    drawRoute();

    drawGPSMarker();


    ctx.restore();

}


/* =====================================================
   VLOEIENDE ANIMATIE
===================================================== */

function animateGPS() {

    if (
        targetGPSMapPoint &&
        displayedGPSMapPoint
    ) {

        /*
           Ook visueel niet direct springen,
           maar soepel naar de nieuwe positie.
        */

        displayedGPSMapPoint.x +=
            (
                targetGPSMapPoint.x -
                displayedGPSMapPoint.x
            ) *
            0.12;


        displayedGPSMapPoint.y +=
            (
                targetGPSMapPoint.y -
                displayedGPSMapPoint.y
            ) *
            0.12;

    }


    draw();


    requestAnimationFrame(
        animateGPS
    );

}


/* =====================================================
   PAGINA OPNIEUW ACTIEF
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
                "visible" &&
            gpsRunning
        ) {

            startLiveWatch();

        }

    }
);


/* =====================================================
   START
===================================================== */

resizeCanvas();

requestAnimationFrame(
    animateGPS
);

</script>
