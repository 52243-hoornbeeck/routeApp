<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta
    name="theme-color"
    content="#071321"
>

<title>Offline</title>

<style>

html,
body {
    height: 100%;
}

body {
    margin: 0;

    display: grid;
    place-items: center;

    background: #050d18;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    text-align: center;

    padding: 25px;
}

.box {
    max-width: 400px;
}

h1 {
    color: #00d4ff;
}

p {
    color: #9eb1c7;
    line-height: 1.5;
}

button {
    padding: 13px 20px;

    border: 0;
    border-radius: 10px;

    background: #00d4ff;

    font-weight: bold;
}

</style>

</head>

<body>

<div class="box">

<h1>
Hoornbeeck Navigatie
</h1>

<p>
De app heeft momenteel geen internetverbinding.
</p>

<button onclick="location.reload()">
Opnieuw proberen
</button>

</div>

</body>

</html>
